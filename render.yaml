services:
  - type: web
    name: asistencia-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString
    buildCommand: ""
    startCommand: ""

databases:
  - name: asistencia-db
    databaseName: asistencia_db
    user: postgres
    plan: free